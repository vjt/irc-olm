[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "irc-olm"
version = "0.1.0"
description = "End-to-end encrypted IRC queries with Olm (vodozemac): framing, key exchange, session recovery, order challenges"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["vodozemac==0.10.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/vjt/irc-olm"
Spec = "https://github.com/vjt/grappa-irc/issues/2430"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
